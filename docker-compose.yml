services:
  backend:
    build:
      context: ./backend
    container_name: smart-incident-timeline-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend/data/uploads:/app/data/uploads
      - ./backend/data/processed:/app/data/processed
      - ./backend/data/reports:/app/data/reports
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/health').then((res) => { if (!res.ok) process.exit(1); process.exit(0); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: smart-incident-timeline-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.example
    depends_on:
      backend:
        condition: service_healthy